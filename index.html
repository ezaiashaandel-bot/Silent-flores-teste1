<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Silent Forest</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">

</head>


<body>


<!-- ======================
MENU INICIAL
====================== -->

<div id="menu">

    <div id="background"></div>

    <div id="lightning"></div>

    <div id="nevoa"></div>


    <h1>
        Silent Forest
    </h1>


    <button id="start">
        JOGAR
    </button>


    <button id="config">
        CONFIGURAÇÕES
    </button>

</div>



<!-- ======================
TELA NICKNAME
====================== -->

<div id="nicknameScreen">

    <div id="nicknameFog"></div>


    <div id="nicknamePanel">


        <h2>
            Criar Personagem
        </h2>


        <p>
            Digite seu nickname
        </p>


        <input
        type="text"
        id="playerName"
        maxlength="16"
        placeholder="Seu nome">


        <div class="screenButtons">


            <button id="backToMenu">
                VOLTAR
            </button>


            <button id="continueToGender">
                CONTINUAR
            </button>


        </div>


    </div>

</div>




<!-- ======================
TELA GÊNERO
====================== -->

<div id="genderScreen">


    <div id="genderFog"></div>


    <div id="genderPanel">


        <h2>
            Escolha o gênero
        </h2>



        <button class="genderButton" id="male">
            Masculino
        </button>


        <button class="genderButton" id="female">
            Feminino
        </button>



        <div class="screenButtons">


            <button id="backGender">
                VOLTAR
            </button>


        </div>


    </div>


</div>





<!-- ======================
CRIAR PERSONAGEM
====================== -->

<div id="characterScreen">


    <div id="characterPanel">


        <h2>
            Personalizar Personagem
        </h2>


        <p>
            Em breve: cabelo, pele, roupa e acessórios
        </p>



        <div class="screenButtons">


            <button id="backCharacter">
                VOLTAR
            </button>


            <button id="finishCharacter">
                CONTINUAR
            </button>


        </div>


    </div>


</div>





<!-- ======================
TELA DO JOGO
====================== -->

<div id="gameScreen">


</div>





<!-- ======================
CONFIGURAÇÕES
====================== -->

<div id="settingsScreen">


    <div id="settingsSide">


        <button class="settingOption" data-page="som">
            SOM
        </button>


        <button class="settingOption" data-page="imagem">
            IMAGEM
        </button>


        <button class="settingOption" data-page="controles">
            CONTROLES
        </button>


    </div>



    <div id="settingsContent">


        <h2>
            CONFIGURAÇÕES
        </h2>


        <div id="settingInfo">

            Selecione uma opção

        </div>


    </div>



    <button id="backSettings">

        VOLTAR

    </button>


</div>





<!-- ======================
TRANSIÇÃO
====================== -->

<div id="transitionScreen"></div>




<script src="script.js"></script>


</body>

    </html>
